<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Código QR - The Little Corner of Art</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inicio.css')}}">
    <style>
        .qr-card {
            max-width: 450px;
            margin: 60px auto;
            background: #ffffff;
            border: 1px solid #d1dde2;
            border-radius: 12px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.12);
        }

        .qr-card h2 {
            color: #222;
            margin-bottom: 10px;
        }

        .qr-card p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .input-group input:focus {
            border-color: #496b7b;
        }

        .btn-generar {
            width: 100%;
            padding: 12px;
            background-color: #496b7b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-generar:hover {
            background-color: #405d69;
        }

        .contenedor-qr {
            margin-top: 25px;
            display: none;
            padding-top: 20px;
            border-top: 1px solid #eef2f4;
        }

        .contenedor-qr img {
            margin: 0 auto 15px;
            border: 3px solid #b6cbd2;
            border-radius: 8px;
        }

        .mensaje-error {
            color: #d94b62;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎨 The Little Corner of Art</div>
        <nav>
            <a href="/">Inicio</a>
            <a href="/cursos">Cursos</a>
            <a href="/artistas">Artistas</a>
        </nav>
    </header>

    <div class="qr-card">
        <h2>Generar Código QR</h2>
        <p>Ingresa el ID del alumno para generar su credencial digital interactiva.</p>

        <form id="form-qr" onsubmit="generarQR(event)">
            <div class="input-group">
                <label for="id_alumno">ID del Alumno:</label>
                <input type="number" id="id_alumno" required placeholder="Ej. 1" min="1">
            </div>

            <button type="submit" class="btn-generar">Generar QR</button>
        </form>

        <div id="mensaje-error" class="mensaje-error"></div>

        <div id="contenedor-qr" class="contenedor-qr">
            <h3 style="font-size:16px; margin-bottom:12px; color:#496b7b;">¡Código QR Generado!</h3>
            <img id="img-qr" src="" alt="Código QR del Alumno">
            <p style="font-size:12px; color:#666;">Escanea este código con la cámara para acceder al carnet digital del estudiante.</p>
            <a id="enlace-directo" href="" target="_blank" style="font-size:13px; color:#496b7b; font-weight:600;">Abrir Carnet Directamente ↗</a>
        </div>
    </div>

    <script>
        async function generarQR(e) {
            e.preventDefault();
            const idAlumno = document.getElementById('id_alumno').value;
            const contQR = document.getElementById('contenedor-qr');
            const msgError = document.getElementById('mensaje-error');

            contQR.style.display = 'none';
            msgError.style.display = 'none';

            try {
                const res = await fetch('/api/generar_qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_alumno: idAlumno })
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    document.getElementById('img-qr').src = data.qr_image;
                    document.getElementById('enlace-directo').href = data.url_carnet;
                    contQR.style.display = 'block';
                } else {
                    msgError.textContent = data.message || 'No se pudo generar el código QR.';
                    msgError.style.display = 'block';
                }
            } catch (error) {
                msgError.textContent = 'Error al conectar con el servidor.';
                msgError.style.display = 'block';
            }
        }
    </script>
</body>
</html>
